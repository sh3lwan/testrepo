<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 45px);
            grid-template-rows: repeat(9, 45px);
            gap: 0;
            margin: 20px auto;
            border: 3px solid #333;
            width: fit-content;
        }

        .sudoku-cell {
            width: 45px;
            height: 45px;
            border: 1px solid #ddd;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            outline: none;
        }

        .sudoku-cell:disabled {
            background-color: #f0f0f0;
            color: #333;
            cursor: not-allowed;
        }

        .sudoku-cell:not(:disabled) {
            background-color: white;
            color: #667eea;
        }

        .sudoku-cell:not(:disabled):focus {
            background-color: #e8eaf6;
            border: 2px solid #667eea;
        }

        /* Thicker borders for 3x3 boxes */
        .sudoku-cell:nth-child(3n) {
            border-right: 3px solid #333;
        }

        .sudoku-cell:nth-child(n+19):nth-child(-n+27),
        .sudoku-cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 3px solid #333;
        }

        /* Top border for rows after each 3x3 box */
        .sudoku-cell:nth-child(n+1):nth-child(-n+9),
        .sudoku-cell:nth-child(n+28):nth-child(-n+36),
        .sudoku-cell:nth-child(n+55):nth-child(-n+63) {
            border-top: 3px solid #333;
        }

        /* Left border for columns after each 3x3 box */
        .sudoku-cell:nth-child(9n+1),
        .sudoku-cell:nth-child(9n+4),
        .sudoku-cell:nth-child(9n+7) {
            border-left: 3px solid #333;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn {
            background-color: #667eea;
            color: white;
        }

        .submit-btn:hover {
            background-color: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .reset-btn {
            background-color: #ff6b6b;
            color: white;
        }

        .reset-btn:hover {
            background-color: #ee5a52;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        .message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }

        .success {
            color: #4caf50;
        }

        .error {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sudoku Game</h1>
        <div class="sudoku-grid" id="sudoku-grid"></div>
        <div class="buttons">
            <button class="submit-btn" onclick="checkSolution()">Submit</button>
            <button class="reset-btn" onclick="resetGame()">Reset</button>
        </div>
        <div class="message" id="message"></div>
    </div>

    <script>
        // Hardcoded Sudoku puzzle (0 represents empty cells)
        const initialPuzzle = [
            [5, 3, 0, 0, 7, 0, 0, 0, 0],
            [6, 0, 0, 1, 9, 5, 0, 0, 0],
            [0, 9, 8, 0, 0, 0, 0, 6, 0],
            [8, 0, 0, 0, 6, 0, 0, 0, 3],
            [4, 0, 0, 8, 0, 3, 0, 0, 1],
            [7, 0, 0, 0, 2, 0, 0, 0, 6],
            [0, 6, 0, 0, 0, 0, 2, 8, 0],
            [0, 0, 0, 4, 1, 9, 0, 0, 5],
            [0, 0, 0, 0, 8, 0, 0, 7, 9]
        ];

        // Solution to the puzzle
        const solution = [
            [5, 3, 4, 6, 7, 8, 9, 1, 2],
            [6, 7, 2, 1, 9, 5, 3, 4, 8],
            [1, 9, 8, 3, 4, 2, 5, 6, 7],
            [8, 5, 9, 7, 6, 1, 4, 2, 3],
            [4, 2, 6, 8, 5, 3, 7, 9, 1],
            [7, 1, 3, 9, 2, 4, 8, 5, 6],
            [9, 6, 1, 5, 3, 7, 2, 8, 4],
            [2, 8, 7, 4, 1, 9, 6, 3, 5],
            [3, 4, 5, 2, 8, 6, 1, 7, 9]
        ];

        // Initialize the game
        function initGame() {
            const grid = document.getElementById('sudoku-grid');
            grid.innerHTML = '';

            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    const cell = document.createElement('input');
                    cell.type = 'text';
                    cell.className = 'sudoku-cell';
                    cell.maxLength = 1;
                    cell.dataset.row = row;
                    cell.dataset.col = col;

                    if (initialPuzzle[row][col] !== 0) {
                        cell.value = initialPuzzle[row][col];
                        cell.disabled = true;
                    } else {
                        cell.value = '';
                        cell.addEventListener('input', validateInput);
                    }

                    grid.appendChild(cell);
                }
            }
        }

        // Validate input to allow only numbers 1-9
        function validateInput(e) {
            const value = e.target.value;
            if (value !== '' && (!/^[1-9]$/.test(value))) {
                e.target.value = '';
            }
        }

        // Check if the current solution is correct
        function checkSolution() {
            const cells = document.querySelectorAll('.sudoku-cell');
            const userSolution = [];
            let isComplete = true;

            // Build user solution from grid
            for (let i = 0; i < 9; i++) {
                userSolution[i] = [];
            }

            cells.forEach(cell => {
                const row = parseInt(cell.dataset.row);
                const col = parseInt(cell.dataset.col);
                const value = cell.value === '' ? 0 : parseInt(cell.value);
                
                userSolution[row][col] = value;
                
                if (value === 0) {
                    isComplete = false;
                }
            });

            const messageEl = document.getElementById('message');

            if (!isComplete) {
                messageEl.textContent = 'Please fill in all cells!';
                messageEl.className = 'message error';
                return;
            }

            // Check if solution matches
            let isCorrect = true;
            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    if (userSolution[row][col] !== solution[row][col]) {
                        isCorrect = false;
                        break;
                    }
                }
                if (!isCorrect) break;
            }

            if (isCorrect) {
                messageEl.textContent = 'Congratulations! You solved it!';
                messageEl.className = 'message success';
            } else {
                messageEl.textContent = 'Not quite right. Keep trying!';
                messageEl.className = 'message error';
            }
        }

        // Reset the game to initial state
        function resetGame() {
            const cells = document.querySelectorAll('.sudoku-cell:not(:disabled)');
            cells.forEach(cell => {
                cell.value = '';
            });

            const messageEl = document.getElementById('message');
            messageEl.textContent = '';
            messageEl.className = 'message';
        }

        // Initialize game on page load
        initGame();
    </script>
</body>
</html>
